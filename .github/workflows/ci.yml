name: Offline regression and public-source boundary
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ci/requirements.txt
      - run: python -m pip install -r ci/requirements.txt
      - name: Synthetic tests (no network, no OCR model downloads)
        run: python scripts/test_offline.py
      - run: python manage.py makemigrations --check --dry-run --settings=car_rental.test_settings
      - run: python scripts/check_public_history.py
